name: Build APK

# 三种触发方式：网页上手动点、push 到 main、打 tag
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 网页上传文件容易丢掉可执行位，先补一下，免得 ./gradlew 报 Permission denied
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      # 签名必须每次都是同一张证书，否则手机上覆盖安装会报「签名不一致」。
      # 这里直接把证书指纹打到日志里，并和固定值比对，签名一变就把构建搞红。
      - name: Verify APK signature is stable
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          EXPECTED="485f0e1dde1065734ca508caf35cd0f29f2daacf620c28e7246bc9db4220d0a7"
          FAIL=0
          for APK in out/*.apk; do
            "$APKSIGNER" verify --print-certs "$APK" > /tmp/sig.txt 2>&1 || true
            if grep -qi "$EXPECTED" /tmp/sig.txt; then
              echo "✅ $(basename "$APK") 签名一致"
            else
              echo "❌ $(basename "$APK") 签名不一致！"; FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1

      # 先上传 APK 再跑单测：万一某个断言不过，包也已经在 artifacts 里了
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordlens-debug-apk
          path: out/*.apk
          retention-days: 30

      - name: Unit-test the pure-Kotlin logic
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # 打 tag 时顺手创建 Release，手机上点一下就能下载安装
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
